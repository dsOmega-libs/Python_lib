[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
authors = [{ name = "DeadlySquad13", email = "46250621+DeadlySquad13@users.noreply.github.com" }]
name = "dsomega_logging"
version = "0.0.1"
requires-python = ">= 3.14"
# Common package deps come from [feature.shared] in root pixi.toml.
# Package-specific deps only:
dependencies = [
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hello_world", "hello_world.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["thirdparty"]
